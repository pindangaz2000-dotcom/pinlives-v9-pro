version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pinlives-db
    environment:
      POSTGRES_USER: pinlives
      POSTGRES_PASSWORD: pinlives_secure_password
      POSTGRES_DB: pinlives_pro
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pinlives_pro/infrastructure/db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinlives"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinlives-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinlives-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELETHON_API_ID: ${TELETHON_API_ID}
      TELETHON_API_HASH: ${TELETHON_API_HASH}
      TELETHON_PHONE: ${TELETHON_PHONE}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID}
      BACKEND_URL: http://backend:8000
      DB_TYPE: postgres
      DB_USER: pinlives
      DB_PASSWORD: pinlives_secure_password
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pinlives_pro
      LOG_LEVEL: INFO
      LOG_FILE: /var/log/pinlives/backend.log
    volumes:
      - ./logs:/var/log/pinlives
      - ./data/sessions:/tmp/telethon_sessions
      - ./data/media:/tmp/telethon_media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pinlives-network
    restart: unless-stopped

  # Telethon Listener Daemon
  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: pinlives-daemon
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TELETHON_API_ID: ${TELETHON_API_ID}
      TELETHON_API_HASH: ${TELETHON_API_HASH}
      TELETHON_PHONE: ${TELETHON_PHONE}
      BACKEND_URL: http://backend:8000
      SESSION_DIR: /tmp/telethon_sessions
      LOG_FILE: /var/log/pinlives/daemon.log
    volumes:
      - ./logs:/var/log/pinlives
      - ./data/sessions:/tmp/telethon_sessions
      - ./data/media:/tmp/telethon_media
    networks:
      - pinlives-network
    restart: unless-stopped

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: pinlives-bot
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID}
      BACKEND_URL: http://backend:8000
      LOG_FILE: /var/log/pinlives/bot.log
    volumes:
      - ./logs:/var/log/pinlives
    networks:
      - pinlives-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  pinlives-network:
    driver: bridge
